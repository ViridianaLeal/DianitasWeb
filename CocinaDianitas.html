
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cocina - Dianita's</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: rgb(255, 248, 231);
    color: rgb(91, 48, 35);
    padding: 20px;
}

.principal {
    max-width: 1400px;
    margin: auto;
}

/* ENCABEZADO */

.encabezado {
    background: rgb(205, 31, 83);
    color: white;
    padding: 25px;
    text-align: center;
    border-radius: 12px;
    margin-bottom: 20px;
}

.encabezado h1 {
    font-family: Georgia, serif;
    font-size: 30px;
    margin-bottom: 8px;
}

/* RESUMEN */

.resumen {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.tarjeta-resumen {
    background: white;
    border: 2px solid rgb(205, 31, 83);
    padding: 18px;
    border-radius: 10px;
    text-align: center;
}

.tarjeta-resumen strong {
    display: block;
    font-size: 28px;
    color: rgb(205, 31, 83);
    margin-bottom: 5px;
}

/* TÍTULO */

.titulo-pedidos {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
}

.titulo-pedidos h2 {
    color: rgb(205, 31, 83);
}

.actualizacion {
    font-size: 12px;
    color: #806b60;
}

/* CONTENEDOR */

.contenedor-pedidos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 18px;
}

/* PEDIDOS */

.pedido {
    background: white;
    border: 2px solid #e5d8cf;
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
}

.pedido.pendiente {
    border-top: 6px solid rgb(239, 125, 37);
}

.pedido.preparando {
    border-top: 6px solid rgb(55, 126, 184);
}

/* INFORMACIÓN */

.cabecera-pedido {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

.cabecera-pedido h2 {
    color: rgb(205, 31, 83);
    font-size: 23px;
}

.numero-pedido {
    font-size: 12px;
    color: #888;
}

.fecha {
    font-size: 12px;
    color: #888;
    margin-bottom: 15px;
}

.estado {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 12px;
}

.estado-pendiente {
    background: #fff0d8;
    color: #bd7200;
}

.estado-preparando {
    background: #e0efff;
    color: #2879b9;
}

/* PRODUCTOS */

.titulo-productos {
    color: rgb(104, 132, 48);
    margin: 10px 0;
    font-size: 17px;
}

.producto {
    background: rgb(255, 248, 231);
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 10px;
    border-left: 4px solid rgb(205, 31, 83);
}

.nombre-producto {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 7px;
}

.detalles {
    font-size: 13px;
    line-height: 1.7;
    color: #5b3023;
}

.detalles strong {
    color: rgb(205, 31, 83);
}

.observaciones {
    background: #fff0d8;
    border: 1px solid #efc58e;
    padding: 10px;
    border-radius: 7px;
    margin-top: 9px;
    font-size: 13px;
    line-height: 1.5;
}

.observaciones strong {
    display: block;
    margin-bottom: 4px;
    color: #bd7200;
}

/* TOTAL */

.total {
    border-top: 2px solid #e5d8cf;
    padding-top: 13px;
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    font-size: 19px;
    font-weight: bold;
    color: rgb(104, 132, 48);
}

/* BOTONES */

.botones {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.boton {
    flex: 1;
    padding: 12px 7px;
    border: none;
    border-radius: 7px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.boton:hover {
    opacity: 0.85;
}

.boton:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.btn-preparar {
    background: rgb(55, 126, 184);
}

.btn-terminar {
    background: rgb(104, 132, 48);
}

/* SIN PEDIDOS */

.sin-pedidos {
    background: white;
    border-radius: 12px;
    padding: 50px 20px;
    text-align: center;
    color: #999;
    grid-column: 1 / -1;
}

.sin-pedidos h3 {
    margin-bottom: 10px;
    color: rgb(205, 31, 83);
}

/* RESPONSIVE */

@media(max-width: 650px) {

    .resumen {
        grid-template-columns: 1fr;
    }

    .contenedor-pedidos {
        grid-template-columns: 1fr;
    }

    .encabezado h1 {
        font-size: 23px;
    }

}
</style>
</head>

<body>

<div class="principal">

    <!-- ENCABEZADO -->

    <header class="encabezado">

        <h1>ANTOJITOS DIANITA'S</h1>

        <p>PANEL DE COCINA</p>

        <p style="font-size:13px;margin-top:8px">
            Control de pedidos
        </p>

    </header>


    <!-- RESUMEN DE PEDIDOS -->

    <section class="resumen">

        <div class="tarjeta-resumen">

            <strong id="pendientes">0</strong>

            Pendientes

        </div>

        <div class="tarjeta-resumen">

            <strong id="preparando">0</strong>

            Preparando

        </div>

        <div class="tarjeta-resumen">

            <strong id="totalPedidos">0</strong>

            Pedidos activos

        </div>

    </section>


    <!-- LISTA DE PEDIDOS -->

    <section>

        <div class="titulo-pedidos">

            <h2>PEDIDOS RECIBIDOS</h2>

            <p class="actualizacion" id="ultimaActualizacion">
                Esperando pedidos...
            </p>

        </div>

        <div class="contenedor-pedidos" id="pedidos">

            <div class="sin-pedidos">
                <h3>Cargando pedidos...</h3>
                Esperando información del servidor.
            </div>

        </div>

    </section>

</div>


<script>

// ==========================================
// ESCAPAR TEXTO PARA MOSTRARLO DE FORMA SEGURA
// ==========================================

function escapar(texto) {

    return String(texto ?? "").replace(/[&<>"']/g, caracter => ({

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"

    })[caracter]);

}


// ==========================================
// CONSULTAR PEDIDOS EN MYSQL
// ==========================================

async function cargarPedidos() {

    try {

        const respuesta = await fetch(
            "php/pedidos/obtenerPedidos.php",
            {
                cache: "no-store"
            }
        );

        if (!respuesta.ok) {

            throw new Error("Error al consultar los pedidos");

        }

        const pedidos = await respuesta.json();

        if (!Array.isArray(pedidos)) {

            throw new Error("Respuesta incorrecta del servidor");

        }

        mostrarPedidos(pedidos);

        document.getElementById("ultimaActualizacion").textContent =
            "Última actualización: " +
            new Date().toLocaleTimeString("es-MX");

    } catch (error) {

        console.error(error);

        document.getElementById("pedidos").innerHTML = `
            <div class="sin-pedidos">
                <h3>Error de conexión</h3>
                No se pudieron cargar los pedidos.
                Verifica Apache, MySQL y PHP.
            </div>
        `;

    }

}


// ==========================================
// MOSTRAR PEDIDOS
// ==========================================

function mostrarPedidos(pedidos) {

    const contenedor =
        document.getElementById("pedidos");

    contenedor.innerHTML = "";

    let cantidadPendientes = 0;

    let cantidadPreparando = 0;


    pedidos.forEach(pedido => {

        if (pedido.estado === "Pendiente") {

            cantidadPendientes++;

        }

        if (pedido.estado === "Preparando") {

            cantidadPreparando++;

        }


        // PRODUCTOS DEL PEDIDO

        let productosHTML = "";

        pedido.productos.forEach(item => {

            let detalles = [];


            // TIPO

            if (item.tipo) {

                detalles.push(
                    "<strong>Tipo:</strong> " +
                    escapar(item.tipo)
                );

            }


            // SABORES

            if (item.sabores && item.sabores.length > 0) {

                detalles.push(
                    "<strong>Sabores:</strong> " +
                    item.sabores.map(escapar).join(", ")
                );

            }


            // INGREDIENTES QUE NO DESEA

            if (
                item.sinIngredientes &&
                item.sinIngredientes.length > 0
            ) {

                detalles.push(
                    "<strong>SIN:</strong> " +
                    item.sinIngredientes.map(escapar).join(", ")
                );

            }


            // EXTRAS

            if (item.extras && item.extras.length > 0) {

                detalles.push(
                    "<strong>Extras:</strong> " +
                    item.extras.map(escapar).join(", ")
                );

            }


            // PRODUCTO

            productosHTML += `

                <div class="producto">

                    <div class="nombre-producto">

                        ${escapar(item.nombre)}

                        x${Number(item.cantidad)}

                    </div>

                    <div class="detalles">

                        ${escapar(item.presentacion)}

                        ${detalles.length > 0
                            ? "<br>" + detalles.join("<br>")
                            : ""
                        }

                    </div>

                    ${item.observaciones ? `

                        <div class="observaciones">

                            <strong>INDICACIONES ESPECIALES:</strong>

                            ${escapar(item.observaciones)}

                        </div>

                    ` : ""}

                </div>

            `;

        });


        // ESTADO

        let claseEstado =
            pedido.estado === "Pendiente"
                ? "estado-pendiente"
                : "estado-preparando";


        let clasePedido =
            pedido.estado === "Pendiente"
                ? "pendiente"
                : "preparando";


        // CREAR TARJETA

        const tarjeta = document.createElement("article");

        tarjeta.className = "pedido " + clasePedido;


        tarjeta.innerHTML = `

            <div class="cabecera-pedido">

                <h2>${escapar(pedido.mesa)}</h2>

                <span class="numero-pedido">

                    Pedido #${Number(pedido.id_pedido)}

                </span>

            </div>


            <p class="fecha">

                Fecha: ${escapar(pedido.fecha)}

            </p>


            <span class="estado ${claseEstado}">

                ${escapar(pedido.estado)}

            </span>


            <h3 class="titulo-productos">

                PRODUCTOS SOLICITADOS

            </h3>


            ${productosHTML}


            <div class="total">

                <span>TOTAL:</span>

                <span>
                    $${Number(pedido.total).toFixed(2)}
                </span>

            </div>


            <div class="botones">

                ${pedido.estado === "Pendiente" ? `

                    <button
                        class="boton btn-preparar"
                        data-id="${Number(pedido.id_pedido)}"
                        data-estado="Preparando">

                        Preparar

                    </button>

                ` : ""}


                <button
                    class="boton btn-terminar"
                    data-id="${Number(pedido.id_pedido)}"
                    data-estado="Terminado">

                    Terminado

                </button>

            </div>

        `;


        // ASIGNAR EVENTOS

        tarjeta.querySelectorAll("button").forEach(boton => {

            boton.addEventListener("click", () => {

                cambiarEstado(
                    Number(boton.dataset.id),
                    boton.dataset.estado,
                    boton
                );

            });

        });


        contenedor.appendChild(tarjeta);

    });


    // CUANDO NO HAY PEDIDOS

    if (pedidos.length === 0) {

        contenedor.innerHTML = `

            <div class="sin-pedidos">

                <h3>No hay pedidos pendientes</h3>

                Los nuevos pedidos aparecerán aquí automáticamente.

            </div>

        `;

    }


    // ACTUALIZAR CONTADORES

    document.getElementById("pendientes").textContent =
        cantidadPendientes;

    document.getElementById("preparando").textContent =
        cantidadPreparando;

    document.getElementById("totalPedidos").textContent =
        pedidos.length;

}


// ==========================================
// CAMBIAR ESTADO DEL PEDIDO
// ==========================================

async function cambiarEstado(id, estado, boton) {

    boton.disabled = true;

    const textoOriginal = boton.textContent;

    boton.textContent = "Actualizando...";

    try {

        const respuesta = await fetch(
            "php/pedidos/actualizarEstado.php",
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    id_pedido: id,

                    estado: estado

                })

            }
        );


        if (!respuesta.ok) {

            throw new Error("No se pudo actualizar el estado");

        }


        const resultado = await respuesta.json();


        if (resultado.success) {

            await cargarPedidos();

        } else {

            alert(
                resultado.mensaje ||
                "No se pudo actualizar el pedido."
            );

            boton.disabled = false;

            boton.textContent = textoOriginal;

        }

    } catch (error) {

        console.error(error);

        alert("Error al actualizar el pedido.");

        boton.disabled = false;

        boton.textContent = textoOriginal;

    }

}


// ==========================================
// ACTUALIZACIÓN AUTOMÁTICA
// ==========================================

// Primera consulta

cargarPedidos();


// Consultar cada 3 segundos

setInterval(cargarPedidos, 3000);

</script>

</body>
</html>
