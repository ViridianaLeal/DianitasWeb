
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Dianita's</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(255, 240, 245);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .tarjeta {
            background-color: white;
            width: 395px;
            height: 520px;
            border-radius: 30px;
            padding: 15px 40px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .logo {
            width: 105px;
            height: 105px;
            object-fit: contain;
            margin-top: 0;
        }

        h1 {
            color: rgb(198, 95, 139);
            font-family: Georgia, serif;
            font-size: 29px;
            margin-top: 5px;
            margin-bottom: 58px;
        }

        .grupo {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: rgb(100, 65, 81);
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 42px;
            padding: 5px 12px;
            border: 1px solid rgb(237, 199, 215);
            border-radius: 8px;
            font-size: 14px;
            color: rgb(100, 65, 81);
            outline: none;
        }

        input:focus {
            border-color: rgb(198, 95, 139);
        }

        button {
            width: 215px;
            height: 45px;
            margin-top: 15px;
            background-color: rgb(198, 95, 139);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: rgb(177, 69, 115);
        }

        @media (max-width: 430px) {
            .tarjeta {
                width: 90%;
                padding-left: 25px;
                padding-right: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="tarjeta">

        <!-- Logo -->
        <img src="assets/img/LogoDianitas.png" class="logo" alt="Logo Dianita's">

        <!-- Nombre de la tienda -->
        <h1>DIANITA'S</h1>

        <!-- Formulario de inicio de sesión -->
        <form id="formulario">

            <div class="grupo">
                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Ingresa tu correo"
                    required>
            </div>

            <div class="grupo">
                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    placeholder="Ingresa tu contraseña"
                    required>
            </div>

            <button type="submit" id="btnIniciar">
                Iniciar sesión
            </button>

        </form>

    </div>

    <!-- JavaScript -->
    <script src="js/appLogin.js"></script>

</body>
</html>
